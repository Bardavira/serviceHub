services:
  app:
    build:
      context: ./docker/php
    container_name: servicehub-app
    volumes:
      - ./src:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
      - composer_cache:/tmp/composer
      - vendor_data:/var/www/vendor
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  queue:
    build:
      context: ./docker/php
    container_name: servicehub-queue
    volumes:
      - ./src:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    depends_on:
      - db
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=1"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: servicehub-nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: servicehub-db
    environment:
      MYSQL_DATABASE: servicehub
      MYSQL_USER: servicehub
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  node:
    build:
      context: ./docker/node
    container_name: servicehub-node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata:
  storage_data:
  cache_data:
  node_modules:
  composer_cache:
  vendor_data: